<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>防災 Agent — GPS 一鍵定位小工具</title>
  <style>
    body { font-family: system-ui, -apple-system, "Microsoft JhengHei", sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; color: #1f2937; }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    .card { border: 1px solid #d1d5db; border-radius: 12px; padding: 1.25rem; background: #f9fafb; margin-top: 1rem; }
    button { background: #dc2626; color: white; border: none; border-radius: 8px; padding: 0.7rem 1.2rem; font-size: 1rem; cursor: pointer; margin-right: 0.5rem; margin-top: 0.5rem; }
    button.secondary { background: #2563eb; }
    button:hover { opacity: 0.92; }
    textarea { width: 100%; height: 90px; margin-top: 0.75rem; padding: 0.6rem; font-size: 0.95rem; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; }
    .status { font-size: 0.9rem; color: #4b5563; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>📍 台灣防災 Agent — GPS 一鍵定位小工具</h1>
  <p>點擊下方按鈕取得你目前的瀏覽器 GPS 座標，再一鍵複製貼到 <code>adk web</code> 對話框即可查最近避難所與撤離路線。</p>

  <div class="card">
    <button onclick="getGPS()">📡 取得我現在的 GPS 位置</button>
    <button class="secondary" onclick="useDemoGPS()">🧪 帶入高雄三民區演練座標</button>
    <div id="status" class="status">尚未定位</div>
    <textarea id="promptBox" placeholder="定位完成後，這裡會自動產生可直接貼進 Agent 的查詢句..."></textarea>
    <button class="secondary" onclick="copyPrompt()">📋 複製查詢句</button>
  </div>

  <script>
    function setPrompt(lat, lon, isDemo) {
      const box = document.getElementById("promptBox");
      if (isDemo) {
        box.value = `請切換到 2024 凱米颱風演練情境。我目前的 GPS 位置是 ${lat}, ${lon}，請問附近有沒有危險？最近的避難收容處所在哪裡、要怎麼去？`;
      } else {
        box.value = `我目前的 GPS 位置是 ${lat}, ${lon}，請問附近現在有沒有災害警戒？最近的避難收容處所在哪裡、要怎麼去？`;
      }
    }

    function getGPS() {
      const status = document.getElementById("status");
      if (!navigator.geolocation) {
        status.textContent = "此瀏覽器不支援 GPS 定位。";
        return;
      }
      status.textContent = "定位中，請允許瀏覽器存取位置權限...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(6);
          const lon = pos.coords.longitude.toFixed(6);
          const acc = Math.round(pos.coords.accuracy);
          status.textContent = `✅ 定位成功：緯度 ${lat}，經度 ${lon}（誤差約 ${acc} 公尺）`;
          setPrompt(lat, lon, false);
        },
        (err) => {
          status.textContent = `❌ 定位失敗：${err.message}（若以本機檔案開啟被瀏覽器限制，請確認位置權限或先用演練座標）`;
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function useDemoGPS() {
      document.getElementById("status").textContent = "🧪 已帶入測試座標：高雄市三民區建工路周邊 (22.646500, 120.320800)";
      setPrompt("22.646500", "120.320800", true);
    }

    async function copyPrompt() {
      const box = document.getElementById("promptBox");
      if (!box.value) return;
      await navigator.clipboard.writeText(box.value);
      document.getElementById("status").textContent = "✅ 已複製！請直接貼到 adk web 對話框送出。";
    }
  </script>
</body>
</html>
